<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     width="256" height="256" viewBox="0 0 256 256">
  <title>AI Provider for MiniMax — icon-256x256</title>
  <defs>
    <!-- MiniMax brand gradient (sampled from minimax.io official OG square) -->
    <linearGradient id="mmGradient" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#E2177F"/>
      <stop offset="50%"  stop-color="#F13D5D"/>
      <stop offset="100%" stop-color="#FF613A"/>
    </linearGradient>
  </defs>
  <!-- Family template: WordPress "W" mark on #1E1E1E ground (badge area pre-erased).
       Embedded from the WordPress sibling AI provider plugin assets
       (ai-provider-for-anthropic) so this asset sits visually consistent
       with Google / OpenAI / Anthropic plugins in the WP.org directory. -->
  <image x="0" y="0" width="256" height="256"
         xlink:href="data:image/png;base64,"/>
  <!-- MiniMax provider badge: gradient circle + white soundwave symbol. -->
  <g id="mm-badge">
    <circle cx="181" cy="181" r="36.00" fill="url(#mmGradient)"/>
    <image x="159.40" y="162.79" width="43.20" height="36.42"
           xlink:href="data:image/png;base64,"/>
  </g>
</svg>
