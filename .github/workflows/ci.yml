name: CI

on:
  push:
    branches:
      - trunk
  pull_request:
    branches:
      - trunk

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:

  # ---------------------------------------------------------------------------
  # JOB 1 — lint
  # PHP CodeSniffer against WPCS rules.
  # ---------------------------------------------------------------------------
  lint:
    name: "PHP Lint (PHPCS)"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup PHP 7.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: "7.4"
          coverage: none
          tools: composer:v2

      - name: Cache Composer dependencies
        uses: actions/cache@v5
        with:
          path: |
            ~/.composer/cache
            vendor
          key: composer-${{ runner.os }}-php74-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            composer-${{ runner.os }}-php74-

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Run PHP CodeSniffer
        run: composer phpcs

  # ---------------------------------------------------------------------------
  # JOB 2 — analyze
  # PHPStan static analysis at configured level.
  # ---------------------------------------------------------------------------
  analyze:
    name: "PHP Static Analysis (PHPStan)"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup PHP 7.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: "7.4"
          coverage: none
          tools: composer:v2

      - name: Cache Composer dependencies
        uses: actions/cache@v5
        with:
          path: |
            ~/.composer/cache
            vendor
          key: composer-${{ runner.os }}-php74-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            composer-${{ runner.os }}-php74-

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Run PHPStan
        run: composer phpstan

  # ---------------------------------------------------------------------------
  # JOB 3 — test
  # PHPUnit across the PHP version matrix.
  # ---------------------------------------------------------------------------
  test:
    name: "PHP Tests (PHP ${{ matrix.php }})"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php:
          - "7.4"
          - "8.0"
          - "8.1"
          - "8.2"
          - "8.3"

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2

      - name: Cache Composer dependencies
        uses: actions/cache@v5
        with:
          path: |
            ~/.composer/cache
            vendor
          key: composer-${{ runner.os }}-php${{ matrix.php }}-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            composer-${{ runner.os }}-php${{ matrix.php }}-

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Run PHPUnit
        run: composer test

  # ---------------------------------------------------------------------------
  # JOB 4 — test-core-sdk
  #
  # The suite above resolves wordpress/php-ai-client to the newest release the
  # constraint allows. WordPress core ships an older one, and that is what the
  # plugin actually runs against on a real site — so a call added against the
  # newer SDK passes CI and fatals in production.
  #
  # This job pins the version core ships. When core updates its bundled copy,
  # bump CORE_AI_CLIENT_VERSION; the value is readable from a WordPress install
  # at wp-includes/php-ai-client/src/AiClient.php (`const VERSION`).
  # ---------------------------------------------------------------------------
  test-core-sdk:
    name: "PHP Tests (AI Client as shipped by WordPress core)"
    runs-on: ubuntu-latest

    env:
      CORE_AI_CLIENT_VERSION: "1.3.1"

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "7.4"
          coverage: none
          tools: composer:v2

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Pin the AI Client to the version WordPress core ships
        run: |
          composer require --working-dir=tools/ai-client --no-interaction --update-no-dev \
            "wordpress/php-ai-client:${CORE_AI_CLIENT_VERSION}"

      - name: Confirm the pin took
        run: |
          installed=$(composer show --working-dir=tools/ai-client --format=json wordpress/php-ai-client | php -r 'echo json_decode(stream_get_contents(STDIN), true)["versions"][0];')
          echo "Resolved wordpress/php-ai-client: ${installed}"
          test "${installed#v}" = "${CORE_AI_CLIENT_VERSION}"

      - name: Run PHPUnit
        run: vendor/bin/phpunit
